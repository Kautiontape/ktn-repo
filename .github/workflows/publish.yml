name: publish

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  repository_dispatch:
    types: [package-updated]
  schedule:
    - cron: '17 6 * * *' # picks up new external builds

# Sole writer of the index. Queue rather than cancel: a cancelled run can leave the
# release holding a database that disagrees with its packages.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPO_NAME: ktn
  RELEASE_TAG: repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch external packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/out
          grep -vE '^\s*(#|$)' external.txt | while read -r repo tag; do
            echo "::group::$repo@$tag"
            gh release download "$tag" --repo "$repo" \
              -p '*.pkg.tar.zst' -D build/out --clobber
            echo "::endgroup::"
          done
          ls -la build/out

      - name: Build, sign and index
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ARCH_REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          # A cancelled 'gpg --export | gh secret set' pipe stores an empty secret, so
          # check the shape, not just that it is set.
          if [[ "${GPG_PRIVATE_KEY:-}" != *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            echo "::error::ARCH_REPO_GPG_KEY is empty or not a PGP private key block — see README.md"
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/work" \
            -e GPG_PRIVATE_KEY \
            -e REPO_NAME="$REPO_NAME" \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Sy --noconfirm >/dev/null

              # Prove the key works before spending time on builds.
              export GNUPGHOME=/tmp/gnupg
              mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import
              gpg --list-secret-keys --with-colons | grep -q "^sec" \
                || { echo "::error::no secret key after import"; exit 1; }
              echo canary > /tmp/canary
              gpg --batch --yes --detach-sign --no-armor /tmp/canary \
                || { echo "::error::signing failed - is the key passphrase-protected?"; exit 1; }
              echo "signing key verified"

              # Install every package'"'"'s declared deps, so adding a package needs no
              # workflow change.
              for d in /work/packages/*/; do
                ( set +u; source "$d/PKGBUILD"
                  printf "%s\n" "${makedepends[@]:-}" "${depends[@]:-}" )
              done | sort -u | grep -v "^$" \
                | xargs -r pacman -S --needed --noconfirm --asdeps >/dev/null

              useradd -m builder
              chown -R builder:builder /work

              for d in /work/packages/*/; do
                echo "=== building $(basename "$d") ==="
                su builder -c "cd $d && makepkg --noconfirm --clean"
                # !debug is set per-PKGBUILD, but never index a debug split.
                find "$d" -maxdepth 1 -name "*.pkg.tar.zst" ! -name "*-debug-*" \
                  -exec mv -t /work/build/out {} +
              done

              cd /work/build/out
              # Re-sign everything, discarding upstream signatures, so this key is the
              # only one clients need to trust.
              for pkg in *.pkg.tar.zst; do
                rm -f "$pkg.sig"
                gpg --batch --yes --detach-sign --no-armor "$pkg"
              done

              repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.zst

              # Releases cannot carry symlinks; replace them with real copies under the
              # names pacman requests. Symlinks must go first or cp aborts.
              rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"
              cp "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db"
              cp "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files"
              for f in "${REPO_NAME}".db "${REPO_NAME}".db.tar.gz \
                       "${REPO_NAME}".files "${REPO_NAME}".files.tar.gz; do
                gpg --batch --yes --detach-sign --no-armor "$f"
              done

              chmod -R a+r /work/build/out
              echo "=== indexed ==="
              bsdtar -tf "${REPO_NAME}.db.tar.gz" | grep "/$"
            '

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build/out

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "ktn pacman repository" \
              --notes "Signed Arch repository for Kautiontape packages. Setup: README.md" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" --clobber *.pkg.tar.zst *.pkg.tar.zst.sig \
            "${REPO_NAME}".db "${REPO_NAME}".db.sig \
            "${REPO_NAME}".db.tar.gz "${REPO_NAME}".db.tar.gz.sig \
            "${REPO_NAME}".files "${REPO_NAME}".files.sig \
            "${REPO_NAME}".files.tar.gz "${REPO_NAME}".files.tar.gz.sig

          # Drop assets for versions no longer in the index.
          ls *.pkg.tar.zst > /tmp/current
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -E '\.pkg\.tar\.zst(\.sig)?$' \
            | while read -r asset; do
                grep -qx "${asset%.sig}" /tmp/current && continue
                echo "Deleting superseded asset: $asset"
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
              done

  # The kautiontape.com/arch/ pages. Separate jobs so a site problem can never touch the
  # pacman repo: by the time these run, `publish` has already shipped the index.
  # Design: docs/design/2026-10-03-ktn-fork-packages.md.
  site:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # .updated comes from each PKGBUILD's last commit date

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install renderer dependencies
        run: pip install --quiet -r site/requirements.txt

      - name: Gather the index and descriptors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site-in/desc
          gh release download "$RELEASE_TAG" -p "${REPO_NAME}.db.tar.gz" -D site-in

          # Built here: ktn-repo rebuilds these nightly with the same version, so their
          # build date says nothing. "Updated" is when the PKGBUILD last changed.
          for d in packages/*/; do
            name=$(basename "$d")
            mkdir -p "site-in/desc/$name"
            [[ -f "$d/ktn.md" ]] && cp "$d/ktn.md" "site-in/desc/$name/"
            git log -1 --format=%cI -- "$d/PKGBUILD" > "site-in/desc/$name/.updated"
          done

          # Built in forks: read ktn.md and .ktn-base from each repo's default branch. A repo
          # without them still gets a card from its pkgdesc.
          grep -vE '^\s*(#|$)' external.txt | while read -r repo _tag; do
            dir="site-in/desc/${repo//\//_}"
            mkdir -p "$dir"
            for f in packaging/arch/ktn.md .ktn-base; do
              # Write only on success, so a 404 body never lands as a descriptor.
              if body=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$repo/contents/$f" 2>/dev/null); then
                printf '%s\n' "$body" > "$dir/$(basename "$f")"
              fi
            done
          done

      - name: Render
        run: python3 site/render.py --db "site-in/${REPO_NAME}.db.tar.gz" --descriptors site-in/desc --out site-out

      - uses: actions/upload-artifact@v7
        with:
          name: arch-site
          path: site-out
          retention-days: 7

  # Runs on the ktn host. This workflow has no pull_request trigger, so only pushes to
  # main, the schedule and manual runs ever reach the self-hosted runner.
  deploy-site:
    needs: site
    runs-on: [self-hosted, ktn]
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arch-site
          path: ${{ runner.temp }}/arch-site

      - name: Swap in the new release
        run: |
          set -euo pipefail
          root=/opt/services/ktn-arch # nginx: location /arch/ { alias $root/current/; }
          rel="$root/releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root/releases"
          rm -rf "$rel"
          cp -a "$RUNNER_TEMP/arch-site" "$rel"
          # Atomic: build the new link beside the old one, then rename over it.
          ln -sfn "$rel" "$root/current.new"
          mv -T "$root/current.new" "$root/current"
          # Keep the last three for rollback (repoint `current` by hand).
          ls -1dt "$root"/releases/* | tail -n +4 | xargs -r rm -rf
          echo "Deployed $(readlink "$root/current")"
